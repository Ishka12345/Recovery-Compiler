name: Recovery Build

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'Manifest URL'
        required: true
        default: 'https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git'
      MANIFEST_BRANCH:
        description: 'Manifest Branch'
        required: true
        default: 'twrp-11'
      DEVICE_TREE_URL:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/Ishka12345/android_device_samsung_j2corelte'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'Device Path'
        required: true
        default: 'device/samsung/j2corey20lte'
      DEVICE_NAME:
        description: 'Device Name'
        required: true
        default: 'j2corey20lte'
      MAKEFILE_NAME:
        description: 'Makefile Name'
        required: true
        default: 'omni_j2corey20lte'
      BUILD_TARGET:
        description: 'Build Target (recovery/boot/vendorboot)'
        required: true
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Environment
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: "docker_buildkit"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses6 lib32ncurses-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip fontconfig python3-pip bc cpio lzop lz4 aria2

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "PATH=$PATH:$HOME/bin" >> $GITHUB_ENV

      - name: Initialize Manifest
        run: |
          mkdir -p workspace
          cd workspace
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          ~/bin/repo init --depth=1 -u ${{ github.event.inputs.MANIFEST_URL }} -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Sync Manifest
        run: |
          cd workspace
          ~/bin/repo sync -c --no-clone-bundle --no-tags --optimized-fetch -j$(nproc --all)

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone --depth=1 --branch ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            ${{ github.event.inputs.DEVICE_TREE_URL }} \
            ${{ github.event.inputs.DEVICE_PATH }}

      - name: Build Recovery
        run: |
          cd workspace
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}-eng
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recovery-${{ github.event.inputs.DEVICE_NAME }}
          path: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.img
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/*.zip
          if-no-files-found: warn
